workflows:
  ios-release:
    name: iOS Release to App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: mimo.rbx.rewards.for.roblox
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      # ── All secrets defined in Codemagic UI → Environment variables ──────
      # Add these in: App Settings → Environment variables:
      #   SUPABASE_URL, SUPABASE_ANON_KEY, PREMIUM_AD_UNIT_ID,
      #   QUICK_AD_UNIT_ID, TAPJOY_SDK_KEY_IOS, TAPJOY_SDK_KEY_ANDROID,
      #   PUBSCALE_APP_ID_IOS, PUBSCALE_SECRET_IOS, GOOGLE_IOS_CLIENT_ID,
      #   GOOGLE_WEB_CLIENT_ID, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN
      flutter: stable

    scripts:
      - name: Set up Flutter
        script: |
          flutter pub get

      # ── Generate app_secrets.dart from Codemagic environment variables ────
      # Keys are stored in Codemagic UI — never in code or git
      - name: Generate app_secrets.dart
        script: |
          cat > env.json << EOF
          {
            "USE_TEST_ADS": "false",
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY",
            "PREMIUM_AD_UNIT_ID": "$PREMIUM_AD_UNIT_ID",
            "QUICK_AD_UNIT_ID": "$QUICK_AD_UNIT_ID",
            "PREMIUM_AD_UNIT_ID_IOS": "$PREMIUM_AD_UNIT_ID_IOS",
            "QUICK_AD_UNIT_ID_IOS": "$QUICK_AD_UNIT_ID_IOS",
            "TEST_AD_UNIT_ID_ANDROID": "ca-app-pub-3940256099942544/5224354917",
            "TEST_INTERSTITIAL_ID_ANDROID": "ca-app-pub-3940256099942544/1033173712",
            "TEST_REWARDED_INTERSTITIAL_ID_ANDROID": "ca-app-pub-3940256099942544/5354046379",
            "TEST_AD_UNIT_ID_IOS": "ca-app-pub-3940256099942544/1712485313",
            "TEST_INTERSTITIAL_ID_IOS": "ca-app-pub-3940256099942544/4411468910",
            "TEST_REWARDED_INTERSTITIAL_ID_IOS": "ca-app-pub-3940256099942544/6978759866",
            "TAPJOY_SDK_KEY_IOS": "$TAPJOY_SDK_KEY_IOS",
            "TAPJOY_SDK_KEY_ANDROID": "$TAPJOY_SDK_KEY_ANDROID",
            "TAPJOY_REPORTING_API_KEY": "$TAPJOY_REPORTING_API_KEY",
            "TAPJOY_SECRET": "$TAPJOY_SECRET",
            "TAPJOY_PLACEMENT_NAME": "Offerwall",
            "PUBSCALE_APP_ID": "$PUBSCALE_APP_ID",
            "PUBSCALE_APP_ID_IOS": "$PUBSCALE_APP_ID_IOS",
            "PUBSCALE_SECRET": "$PUBSCALE_SECRET",
            "PUBSCALE_SECRET_IOS": "$PUBSCALE_SECRET_IOS",
            "PUBSCALE_SANDBOX": "false",
            "GOOGLE_WEB_CLIENT_ID": "$GOOGLE_WEB_CLIENT_ID",
            "GOOGLE_IOS_CLIENT_ID": "$GOOGLE_IOS_CLIENT_ID",
            "UPSTASH_REDIS_REST_URL": "$UPSTASH_REDIS_REST_URL",
            "UPSTASH_REDIS_REST_TOKEN": "$UPSTASH_REDIS_REST_TOKEN",
            "INTEGRATION_TEST": "false"
          }
          EOF
          dart run tool/generate_secrets.dart

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --obfuscate \
            --split-debug-info=build/debug-info

    artifacts:
      - build/ios/ipa/*.ipa
      - build/debug-info/

    publishing:
      app_store_connect:
        # Codemagic auto-handles App Store Connect API auth
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false  # Change to true for full release

  # ── Android Play Store Release ─────────────────────────────────────────────
  android-release:
    name: Android Release to Play Store
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      android_signing:
        - rbx_keystore
      vars:
        PACKAGE_NAME: "com.example.rbx_rewards"
      flutter: stable

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Generate app_secrets.dart
        script: |
          cat > env.json << EOF
          {
            "USE_TEST_ADS": "false",
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY",
            "PREMIUM_AD_UNIT_ID": "$PREMIUM_AD_UNIT_ID",
            "QUICK_AD_UNIT_ID": "$QUICK_AD_UNIT_ID",
            "PREMIUM_AD_UNIT_ID_IOS": "$PREMIUM_AD_UNIT_ID_IOS",
            "QUICK_AD_UNIT_ID_IOS": "$QUICK_AD_UNIT_ID_IOS",
            "TEST_AD_UNIT_ID_ANDROID": "ca-app-pub-3940256099942544/5224354917",
            "TEST_INTERSTITIAL_ID_ANDROID": "ca-app-pub-3940256099942544/1033173712",
            "TEST_REWARDED_INTERSTITIAL_ID_ANDROID": "ca-app-pub-3940256099942544/5354046379",
            "TEST_AD_UNIT_ID_IOS": "ca-app-pub-3940256099942544/1712485313",
            "TEST_INTERSTITIAL_ID_IOS": "ca-app-pub-3940256099942544/4411468910",
            "TEST_REWARDED_INTERSTITIAL_ID_IOS": "ca-app-pub-3940256099942544/6978759866",
            "TAPJOY_SDK_KEY_IOS": "$TAPJOY_SDK_KEY_IOS",
            "TAPJOY_SDK_KEY_ANDROID": "$TAPJOY_SDK_KEY_ANDROID",
            "TAPJOY_REPORTING_API_KEY": "$TAPJOY_REPORTING_API_KEY",
            "TAPJOY_SECRET": "$TAPJOY_SECRET",
            "TAPJOY_PLACEMENT_NAME": "Offerwall",
            "PUBSCALE_APP_ID": "$PUBSCALE_APP_ID",
            "PUBSCALE_APP_ID_IOS": "$PUBSCALE_APP_ID_IOS",
            "PUBSCALE_SECRET": "$PUBSCALE_SECRET",
            "PUBSCALE_SECRET_IOS": "$PUBSCALE_SECRET_IOS",
            "PUBSCALE_SANDBOX": "false",
            "GOOGLE_WEB_CLIENT_ID": "$GOOGLE_WEB_CLIENT_ID",
            "GOOGLE_IOS_CLIENT_ID": "$GOOGLE_IOS_CLIENT_ID",
            "UPSTASH_REDIS_REST_URL": "$UPSTASH_REDIS_REST_URL",
            "UPSTASH_REDIS_REST_TOKEN": "$UPSTASH_REDIS_REST_TOKEN",
            "INTEGRATION_TEST": "false"
          }
          EOF
          dart run tool/generate_secrets.dart

      - name: Build release AAB
        script: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/debug-info

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/debug-info/

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal   # internal → alpha → beta → production
        submit_as_draft: true
